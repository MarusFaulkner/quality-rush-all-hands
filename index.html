<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quality Rush: All Hands</title>
<meta name="description" content="Maya, Mike and Mister Quality on one plant floor. Prevent at the machine, detect on the line, contain at the dock. A 3-minute manufacturing quality game.">
<meta name="theme-color" content="#060f1c">
<meta property="og:title" content="Quality Rush: All Hands">
<meta property="og:description" content="Prevention, detection and containment on one plant floor.">
<meta property="og:image" content="assets/logo.webp">
<link rel="icon" href="assets/mq_face_serious.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<section class="screen scroll" id="title"></section>
<section class="screen" id="play" hidden>
  <div class="hud">
    <div class="tile"><div class="k">Score</div><div class="v" id="hScore">0</div></div>
    <div class="tile"><div class="k">Uptime</div><div class="v good" id="hUp">100%</div></div>
    <div class="tile"><div class="k">Shift</div><div class="v" id="hTime">3:00</div></div>
    <div class="tile"><div class="k">Escapes</div><div class="marks" id="hEsc"></div></div>
    <div class="tile"><div class="k">Held</div><div class="v" id="hHeld">0</div></div>
    <button class="iconbtn" id="sndBtn" aria-label="Mute sound"></button>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div class="rotlock" id="rotlock"><div class="rl-ico">⟳</div><b>Turn your phone sideways</b><span>All Hands needs the full width of the plant floor. The shift is paused and picks up where you left off.</span></div>
  <div class="stagebox" id="stagebox"><div class="stage" id="stage">
    <canvas id="cv" aria-label="All Hands plant floor. Tap a character to take control, tap a machine, a part or a box to act."></canvas>
    <div class="overlay" id="ov"></div>
    <div class="rp" id="rp" hidden></div>
  </div></div>
  <div class="team" id="team"></div>
  <div class="callout mcall"><div class="face" id="mFace"></div><div class="bubble" id="mSay">All hands. Keep it clean from source to truck.</div></div>
  <div class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> switch · <b>click</b> a machine, part or box · <kbd>←</kbd><kbd>→</kbd> move · <kbd>Space</kbd> repair · <kbd>P</kbd> pause</div>
</section>
<section class="screen scroll" id="end" hidden></section>
<noscript><p style="padding:24px;color:#fff">All Hands needs JavaScript to run.</p></noscript>
<script src="js/game.js"></script>
</body>
</html>
